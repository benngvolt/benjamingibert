# Domaine de référence : benjamingibert.com (sans www), comme les balises canoniques et le sitemap.
# Une seule adresse par page : sans cela Google voit plusieurs URL au même contenu (www / sans www,
# avec / sans slash final, /index.html, URL inexistantes qui renvoient l'accueil) et signale des doublons.

# www -> sans www
server {
  listen 80;
  server_name www.benjamingibert.com;
  return 301 https://benjamingibert.com$request_uri;
}

server {
  listen 80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # /index.html et /page.html ne sont pas des adresses de page : on renvoie vers l'adresse propre.
  # (`if` sur $request_uri, l'URL d'origine : insensible aux redirections internes d'nginx.)
  if ($request_uri = /index.html) {
    return 301 https://benjamingibert.com/;
  }
  if ($request_uri ~ "^/(about|gemmes|live|nightingales|taihua)\.html$") {
    return 301 https://benjamingibert.com/$1;
  }

  # Slash final : /taihua/ -> /taihua
  location ~ "^/(.+)/$" {
    return 301 https://benjamingibert.com/$1$is_args$args;
  }

  location = / {
    try_files /index.html =404;
  }

  # Pages prérendues au build (scripts/prerender.js) : /about est servi par about.html
  location / {
    try_files $uri $uri.html =404;
  }

  # Pages de l'application qui ne sont pas prérendues (pages privées, non indexées) : coquille React.
  location = /midigen {
    try_files /index.html =404;
  }
  location = /34L4R {
    try_files /index.html =404;
  }

  # Une adresse inconnue renvoie un vrai 404 (et non l'accueil avec un code 200).
  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
